user nobody nogroup; 
error_log  /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections  1024; }



http {
  include mime.types; 
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log combined;
  sendfile on;

  upstream api {
    server api:5000 fail_timeout=0;
  }

  # /mcp takes a username and password on every request, so slow down password guessing.
  limit_req_zone $binary_remote_addr zone=mcp:10m rate=5r/s;

  server {
      listen       80;
      server_name  localhost 127.0.0.1;
      root   /usr/share/nginx/html; 
      
      ## SETTINGS ##
      keepalive_timeout 5;
      client_max_body_size 4G; 
      proxy_read_timeout 600;
      proxy_connect_timeout 600;
      proxy_send_timeout 600;

      ## GZIP ##
      gzip on;
      gzip_disable "msie6";

      gzip_vary on;
      gzip_proxied any;
      gzip_comp_level 6;
      gzip_buffers 16 8k;
      gzip_http_version 1.1;
      gzip_min_length 256;
      gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

      ## LOCATIONS ##
      # Serve static assets directly (with proper MIME types and caching)
      location /assets/ {
          try_files $uri =404;
          expires 1y;
          add_header Cache-Control "public, immutable";
      }
      
      # No caching for index.html (always fetch latest)
      location = /index.html {
          add_header Cache-Control "no-cache, no-store, must-revalidate";
          add_header Pragma "no-cache";
          add_header Expires "0";
          try_files $uri =404;
      }
      
      location / {
          index  index.html;
          try_files $uri $uri/ /index.html;
      }

      location /api {
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Host $http_host; 
          proxy_redirect off;
          proxy_pass http://api;
      }

      # Read-only MCP server (raven_mcp/). Clients send the user's password, so this must only be
      # reachable over HTTPS: the TLS terminator in front of this nginx has to enforce that.
      location /mcp {
          limit_req zone=mcp burst=20 nodelay;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Host $http_host;
          proxy_redirect off;
          # Resolved per request through Docker's DNS, so nginx still starts (and /mcp just
          # returns 502) on deployments that don't run the mcp service.
          resolver 127.0.0.11 valid=30s;
          set $mcp_upstream http://mcp:8000;
          proxy_pass $mcp_upstream;
      }
  } 
}