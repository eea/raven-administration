services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${CONTAINER_NAME_API:-raven-api}
    container_name: ${CONTAINER_NAME_API:-raven-api}
    sysctls:
      - net.ipv4.tcp_keepalive_time=200
    env_file: .env
    environment:
      - RFILES_DIR=/app/rfiles
      - R_API_URL=http://rnotebook:8888
    ports:
      - ${API_PORT:-5000}:5000
    volumes:
      - rfiles-data:/app/rfiles
      - client-dist:/app/client/dist
    extra_hosts:
      - "dev-db-dmz02:10.5.1.23"
    restart: always
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: ${CONTAINER_NAME_CLIENT:-raven-client}
    container_name: ${CONTAINER_NAME_CLIENT:-raven-client}
    depends_on:
      - api
    ports:
      - ${CLIENT_PORT:-80}:80
    volumes:
      - client-dist:/usr/share/nginx/html
    restart: always
  # Read-only MCP server, reached through the client's nginx at /mcp (no port of its own).
  # Off unless MCP_ENABLED=true in .env: the server then exits at start and stays stopped,
  # and nginx answers /mcp with 502.
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: ${CONTAINER_NAME_MCP:-raven-mcp}
    container_name: ${CONTAINER_NAME_MCP:-raven-mcp}
    depends_on:
      - api
    environment:
      - RAVEN_API_URL=http://api:5000
      # TEMPORARY: on by default while MCP is tested on servers. Change back to false before release.
      - MCP_ENABLED=${MCP_ENABLED:-true}
    # on-failure, not always: a disabled server exits cleanly and must not be restarted.
    restart: on-failure
  # rnotebook:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.rnotebook
  #   image: ${CONTAINER_NAME_RNOTEBOOK:-raven-rnotebook}
  #   container_name: ${CONTAINER_NAME_RNOTEBOOK:-raven-rnotebook}
  #   environment:
  #     - R_PORT=${R_PORT:-8888}
  #     - R_WORKDIR=${R_WORKDIR:-/srv/workspace}
  #   ports:
  #     - ${R_PORT:-8888}:${R_PORT:-8888}
  #   restart: always
  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    image: ${CONTAINER_NAME_CRON:-raven-cron}
    container_name: ${CONTAINER_NAME_CRON:-raven-cron}
    restart: always

volumes:
  rfiles-data:
  client-dist:
